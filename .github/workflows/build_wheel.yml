on:
  push:
    branches:
      - wheel
  workflow_dispatch:

name: Build and Release ONNX Runtime (no qemu)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  TAG_NAME: 1.18.2-scenera-eigen-test-5 // ${{ github.ref_name }}

jobs:
  build-wheel:
    runs-on: Scenera-ARM64-Runner-4core
    outputs:
      wheel_path: ${{ steps.set-output.outputs.wheel_path }}
    steps:
      - name: Setup paths
        run: |
          export PREFIX=$RUNNER_TEMP/local
          echo "PREFIX=$PREFIX" >> $GITHUB_ENV

      - name: Download Qualcomm SDK
        run: |
          mkdir -p $PREFIX
          cd $PREFIX
          wget https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v2.22.6.240515.zip
          unzip v2.22.6.240515.zip

      - name: Check gcc versions
        run: |
          gcc -v
          gcc-10 -v

      - name: Install numpy
        run: sudo apt install -y python3-numpy

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build ONNX Runtime (expected failure)
        id: build1
        continue-on-error: true
        run: |
          export ADSP_LIBRARY_PATH=$PREFIX/qairt/2.22.6.240515/lib/hexagon-v68/unsigned/
          export CC=gcc-10
          export CXX=g++-10
          ./build.sh --parallel \
            --use_qnn --qnn_home=$PREFIX/qairt/2.22.6.240515/ \
            --build_shared_lib --skip_submodule_sync --allow_running_as_root \
            --config Release --build_wheel

      - name: Build ONNX Runtime (expected success)
        if: steps.build1.outcome == 'failure'
        run: |
          ./build.sh --parallel \
            --use_qnn --qnn_home=$PREFIX/qairt/2.22.6.240515/ \
            --build_shared_lib --skip_submodule_sync \
            --config Release --build_wheel --build

      - name: Install and test the wheel
        run: |
          ls ./build/Linux/Release/dist/*.whl
          pip install ./build/Linux/Release/dist/*.whl
          python3 -c "import onnxruntime as ort; print(ort.__version__); print(ort.get_available_providers())"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-wheel
          path: ./build/Linux/Release/dist/*.whl

  tag-release:
    needs: build-wheel
    runs-on: Scenera-ARM64-Runner-4core
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Tag release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag v${{ env.TAG_NAME }}
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin v${{ env.TAG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-release:
    needs: [build-wheel, tag-release]
    runs-on: Scenera-ARM64-Runner-4core
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-wheel
          path: ./wheel-download

      - name: List all .whl files
        run: find . -name "*.whl"

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TAG_NAME }}
          files: ./wheel-download/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete local wheel artifact
        run: rm -rf ./wheel-download
